name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          mkdir -p output
          find . -name "*.apk" -path "*/debug/*" -exec cp {} output/DeekseepPro-v9.0.0-debug.apk \; 2>/dev/null || true
          ls -la output/

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeekseepPro-debug
          path: output/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
